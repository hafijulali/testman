name: testman
version: 1.0.0+1
publish_to: none
environment:
  sdk: ">=3.1.3 <4.0.0"
description: A Free and OpenSource, multi-platform API testing app.
dependencies:
  archive: ^4.0.2
  cupertino_icons: ^1.0.2
  dio: ^5.7.0
  file_picker: ^8.1.7
  flutter:
    sdk: flutter
  hive_ce: ^2.10.1
  hive_ce_flutter: ^2.2.0
  keymap: ^0.0.92
  path: ^1.8.3
  path_provider: ^2.1.1
  permission_handler: ^11.0.1
  timezone: ^0.10.0
dev_dependencies:
  build_runner: ^2.4.15
  flutter_launcher_icons: ^0.14.2
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  hive_ce_generator: ^1.8.1
  lints: ^5.0.0
  pubspec_dependency_sorter: ^1.0.3
flutter:
  assets:
    - assets/icon/app_icon.png
  uses-material-design: true
